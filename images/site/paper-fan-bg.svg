<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1f2"/>
      <stop offset="1" stop-color="#eceaee"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7ecea"/>
      <stop offset="1" stop-color="#f2e4e2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="14" stdDeviation="18" flood-color="#b9b2b6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- pale grey-white base -->
  <rect width="2000" height="1300" fill="url(#page)"/>

  <!-- fanned blush sheets, top-left cluster -->
  <g filter="url(#soft)">
    <polygon points="-100,-200 900,-200 -100,800" fill="url(#sheet)" opacity="0.9"/>
  </g>
  <g filter="url(#soft)">
    <polygon points="-100,-100 830,-160 -100,930" fill="#f6e9e7" opacity="0.85"/>
  </g>
  <g filter="url(#soft)">
    <polygon points="-100,60 780,-60 -100,1060" fill="#f4e5e3" opacity="0.9"/>
  </g>

  <!-- lower fan of narrow sheets -->
  <g filter="url(#soft)">
    <polygon points="-100,700 860,620 -100,1400" fill="#f6e9e7" opacity="0.9"/>
  </g>
  <g filter="url(#soft)">
    <polygon points="-100,860 800,780 -100,1520" fill="#f2e2e0" opacity="0.9"/>
  </g>

  <!-- faint translucent veil across the fan for the vellum feel -->
  <polygon points="-100,-200 640,-200 -100,900" fill="#ffffff" opacity="0.35"/>
</svg>
