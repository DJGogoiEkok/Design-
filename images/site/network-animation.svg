<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .line {
        fill: none;
        stroke: #1e1b4b; /* Navy blue */
        stroke-width: 1.5;
        opacity: 0.15;
      }
      .line-thin {
        fill: none;
        stroke: #1e1b4b;
        stroke-width: 0.8;
        opacity: 0.1;
      }
      .line-dashed {
        fill: none;
        stroke: #1e1b4b;
        stroke-width: 1.5;
        stroke-dasharray: 4 6;
        opacity: 0.2;
      }
      
      /* The animated flowing "data" or arrow that travels along the path */
      .flow-line {
        fill: none;
        stroke: #4338ca; /* Brighter blue for the animated part */
        stroke-width: 2.5;
        stroke-dasharray: 20 2000;
        stroke-dashoffset: 2000;
        opacity: 0;
        animation: flowAnimation linear infinite;
        stroke-linecap: round;
      }
      
      .flow-line-fast {
        fill: none;
        stroke: #6366f1; /* Even brighter */
        stroke-width: 2;
        stroke-dasharray: 15 2000;
        stroke-dashoffset: 2000;
        opacity: 0;
        animation: flowAnimation linear infinite;
        stroke-linecap: round;
      }

      @keyframes flowAnimation {
        0% { stroke-dashoffset: 2000; opacity: 0; }
        10% { opacity: 0.9; }
        90% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      
      /* Reverse flow for paths where the arrow points the other way */
      .flow-line-reverse {
        fill: none;
        stroke: #4338ca;
        stroke-width: 2.5;
        stroke-dasharray: 20 2000;
        stroke-dashoffset: 0;
        opacity: 0;
        animation: flowAnimationReverse linear infinite;
        stroke-linecap: round;
      }

      @keyframes flowAnimationReverse {
        0% { stroke-dashoffset: 0; opacity: 0; }
        10% { opacity: 0.9; }
        90% { opacity: 0.9; }
        100% { stroke-dashoffset: 2000; opacity: 0; }
      }

      .node {
        fill: #1e1b4b;
      }
      
      .node-empty {
        fill: #ffffff;
        stroke: #1e1b4b;
        stroke-width: 1.5;
      }
      
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      
      .pulse-node-fast {
        animation: pulse 1.5s ease-in-out infinite alternate;
      }
      
      @keyframes pulse {
        0% { transform: scale(0.8); opacity: 0.6; }
        100% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Path 1: Sweeping curve from top left to bottom right -->
  <path class="line" d="M -100 100 C 300 -100, 600 600, 1300 400" />
  <path class="flow-line" d="M -100 100 C 300 -100, 600 600, 1300 400" style="animation-duration: 6s; animation-delay: 0s;" />
  <path class="flow-line-fast" d="M -100 100 C 300 -100, 600 600, 1300 400" style="animation-duration: 4s; animation-delay: 3.5s;" />
  <circle cx="230" cy="115" r="5" class="node pulse-node" style="transform-origin: 230px 115px;" />
  <circle cx="530" cy="330" r="4" class="node" />
  
  <!-- Path 2: Large circular orbit -->
  <path class="line" d="M 300 800 C 300 200, 900 200, 900 800" />
  <path class="flow-line" d="M 300 800 C 300 200, 900 200, 900 800" style="animation-duration: 8s; animation-delay: 1.5s;" />
  <path class="flow-line-fast" d="M 300 800 C 300 200, 900 200, 900 800" style="animation-duration: 5s; animation-delay: 5s;" />
  <circle cx="410" cy="500" r="4" class="node" />
  <circle cx="790" cy="500" r="6" class="node-empty pulse-node" style="transform-origin: 790px 500px;" />

  <!-- Path 3: Dotted curve -->
  <path class="line-dashed" d="M 100 700 C 400 400, 700 300, 1000 150" />
  <path class="flow-line" d="M 100 700 C 400 400, 700 300, 1000 150" style="animation-duration: 5s; animation-delay: 3s;" />
  <circle cx="700" cy="275" r="4" class="node" />

  <!-- Path 4: Right to left (Reverse) -->
  <path class="line" d="M 1300 700 C 900 900, 500 500, -100 400" />
  <path class="flow-line-reverse" d="M 1300 700 C 900 900, 500 500, -100 400" style="animation-duration: 7s; animation-delay: 0.5s;" />
  <path class="flow-line-reverse" d="M 1300 700 C 900 900, 500 500, -100 400" style="animation-duration: 4.5s; animation-delay: 4s;" />
  <circle cx="850" cy="745" r="5" class="node-empty" />
  <circle cx="350" cy="460" r="3" class="node" />
  
  <!-- NEW Path 5: Top right to bottom center -->
  <path class="line-thin" d="M 1000 -100 C 1200 200, 800 600, 400 900" />
  <path class="flow-line-fast" d="M 1000 -100 C 1200 200, 800 600, 400 900" style="animation-duration: 5.5s; animation-delay: 1.2s;" />
  <path class="flow-line" d="M 1000 -100 C 1200 200, 800 600, 400 900" style="animation-duration: 9s; animation-delay: 4.5s;" />
  <circle cx="865" cy="455" r="3" class="node" />

  <!-- NEW Path 6: Gentle horizontal wave -->
  <path class="line-thin" d="M -50 350 C 400 250, 800 550, 1250 400" />
  <path class="flow-line" d="M -50 350 C 400 250, 800 550, 1250 400" style="animation-duration: 10s; animation-delay: 2s;" />
  <path class="flow-line-fast" d="M -50 350 C 400 250, 800 550, 1250 400" style="animation-duration: 4s; animation-delay: 7s;" />
  
  <!-- NEW Path 7: Tight loop on the left -->
  <path class="line-dashed" d="M 200 -50 C -100 200, 100 600, 500 850" />
  <path class="flow-line-reverse" d="M 200 -50 C -100 200, 100 600, 500 850" style="animation-duration: 6.5s; animation-delay: 0.8s;" />
  <circle cx="80" cy="400" r="4" class="node-empty pulse-node-fast" style="transform-origin: 80px 400px;" />

  <!-- A static dotted circle cluster -->
  <circle cx="850" cy="300" r="80" class="line-dashed" />
  <circle cx="850" cy="300" r="140" class="line-thin" style="stroke-dasharray: 2 10;" />
  <circle cx="850" cy="300" r="4" class="node pulse-node" style="transform-origin: 850px 300px;" />

  <!-- Concentric node clusters -->
  <circle cx="150" cy="450" r="8" class="node-empty" />
  <circle cx="150" cy="450" r="4" class="node-empty pulse-node-fast" style="transform-origin: 150px 450px;" />

  <circle cx="1050" cy="650" r="10" class="node-empty" />
  <circle cx="1070" cy="630" r="6" class="node-empty pulse-node" style="transform-origin: 1070px 630px;" />
  
  <!-- Additional arrows static elements -->
  <polygon points="500,270 515,260 510,278" fill="#1e1b4b" opacity="0.3" transform="rotate(45 500 270)" />
  <polygon points="800,680 815,670 810,688" fill="#1e1b4b" opacity="0.3" transform="rotate(-30 800 680)" />
  <polygon points="250,550 265,540 260,558" fill="#1e1b4b" opacity="0.3" transform="rotate(110 250 550)" />
  <polygon points="1000,250 1015,240 1010,258" fill="#1e1b4b" opacity="0.3" transform="rotate(-60 1000 250)" />
</svg>
