<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- warm yellow paper base -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c433"/>
      <stop offset="1" stop-color="#efb511"/>
    </linearGradient>
    <linearGradient id="fadeblue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa3b8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8fa3b8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="fadelight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cfe3ec" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fadedeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2860a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2860a8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fadeteal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3b6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5fb3b6" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>

  <!-- big grey-blue sheet, top left -->
  <rect x="-380" y="-360" width="760" height="760" fill="url(#fadeblue)" transform="rotate(24 0 0)"/>
  <!-- translucent pale sheet overlapping it -->
  <rect x="120" y="-500" width="760" height="820" fill="#e8ddc8" opacity="0.35" transform="rotate(24 400 -100)"/>

  <!-- large light blue sheet, top right -->
  <rect x="880" y="-380" width="900" height="820" fill="url(#fadelight)" transform="rotate(24 1200 0)"/>
  <rect x="1060" y="-260" width="820" height="760" fill="#cfe3ec" opacity="0.5" transform="rotate(24 1400 100)"/>

  <!-- teal sheet, bottom left -->
  <rect x="-320" y="680" width="620" height="620" fill="url(#fadeteal)" transform="rotate(24 -40 940)"/>

  <!-- deep blue sheets, bottom middle/right -->
  <rect x="480" y="760" width="720" height="640" fill="url(#fadedeep)" transform="rotate(24 800 1060)"/>
  <rect x="760" y="640" width="820" height="700" fill="#2f6cb4" opacity="0.55" transform="rotate(24 1150 980)"/>
  <!-- hazy blue translucent overlay sweeping the right -->
  <rect x="1080" y="420" width="900" height="820" fill="#5a80a8" opacity="0.35" transform="rotate(24 1500 800)"/>

  <!-- faint translucent film across the middle for the layered-paper feel -->
  <rect x="480" y="-200" width="560" height="1400" fill="#ffffff" opacity="0.12" transform="rotate(24 760 500)"/>
</svg>
