.sticky-card {

.sticky-card:hover {

.sticky-note {

.paperclip {

.card-pill {

.card-content {

}
.card-title {

  // 2. GENERALIZED FOREGROUND SLIDER INITIALIZATION
  const initSlider = (sectionId, label, dataList) => {
    const section = document.getElementById(sectionId);
    if (!section) return;
    
    const track = section.querySelector('.sticky-cards-track');
    const viewport = section.querySelector('.slider-viewport');
    const cardColors = ['#d92534', '#f2a600', '#2460a7', '#50b2a0', '#d36582']; 

    dataList.forEach((item, index) => {
      const num = (index + 1).toString().padStart(2, '0');
      const color = cardColors[index % cardColors.length];
      const rotation = -4 + (Math.random() * -4); 
      const clipRotation = rotation + 8 + (Math.random() * 4);

      const cardHTML = `
        <div class="sticky-card" style="border: 2px solid ${color}60;">
          <svg viewBox="0 0 100 200" class="paperclip" style="transform: rotate(${clipRotation}deg);">
            <path d="M 45,30 v 110 a 25,25 0 0,0 50,0 v -125 a 35,35 0 0,0 -70,0 v 135 a 15,15 0 0,0 30,0 v -105" fill="none" stroke="#222222" stroke-width="10" stroke-linecap="round"/>
          </svg>
          <div class="sticky-note" style="background-color: ${color}; transform: rotate(${rotation}deg);">
            ${num}
          </div>
          <div class="card-content" style="flex: 1; width: 100%; display: grid; grid-template-rows: 25px 130px 1fr; align-items: center; justify-items: center;">

            </div>
            <div class="card-text" style="text-align: center; align-self: start; padding-top: 5px;">${item.name}</div>
          </div>
          <div class="card-pill" style="background-color: ${color};"></div>
        </div>
      `;
      track.insertAdjacentHTML('beforeend', cardHTML);
    });

    const updateSlider = () => {
      const rect = section.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      const totalScroll = section.offsetHeight - windowHeight;
      const currentScroll = -rect.top;
      
      let progress = currentScroll / totalScroll;
      progress = Math.max(0, Math.min(1, progress));
      
      const maxTranslate = -(track.scrollWidth - viewport.offsetWidth);
      const translateX = progress * maxTranslate;
      track.style.transform = `translateX(${translateX}px)`;
    };

    window.addEventListener('scroll', updateSlider);
    window.addEventListener('resize', updateSlider);
    setTimeout(updateSlider, 50);
  };
